  question: So are the traditional three pillars useless for LLM apps?
  answer: 'No, the traditional three pillars (metrics, logs, and traces) are not useless for LLM applications,
    but they are not sufficient on their own. The three pillars remain the foundation of observability
    because they capture the events that occur in any distributed system, including LLM-powered ones.
    You still need metrics for latency and cost tracking, logs for error capture, and traces to follow
    requests through a workflow.


    However, as the LLM Observability guide explains, traditional monitoring falls short for LLM applications
    because LLMs are non-deterministic and present unique challenges, such as hallucinations, unpredictable
    performance and costs, security vulnerabilities like prompt hacking, and inconsistent user experiences.
    These problems are often qualitative and invisible to standard logs, metrics, and traces alone. For
    example, a response can be returned quickly (good metric), without errors (clean logs), and traced
    end-to-end (complete trace), yet still contain a hallucination or a fabricated citation that misleads
    the user.


    This is why observability for LLM apps needs to be augmented with LLM-specific evaluations, such as
    Datadog''s out-of-the-box hallucination detection, which checks whether an LLM''s output disagrees
    with retrieved context, omits key facts, or fabricates sources. In short, the three pillars are a
    necessary baseline, but LLM observability requires an additional layer of evaluation and quality monitoring
    to address the qualitative failure modes that traditional APM was never designed to detect.'

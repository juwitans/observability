  question: So are the traditional three pillars useless for LLM apps?
  answer: 'No, the traditional three pillars (metrics, logs, and traces) are far from useless for LLM
    applications — but on their own, they are no longer sufficient. Think of them as the necessary foundation
    that must be extended with LLM-specific telemetry to give you true visibility into AI systems.


    **Why the pillars still matter**

    - **Metrics** are essential for tracking LLM-specific signals like token usage, cost per request,
    latency (including time-to-first-token and total completion time), error rates, and throughput. You
    still need to alert on cost spikes and latency regressions.

    - **Logs** remain valuable for capturing raw prompts, completions, retrieved documents, error stack
    traces, and debugging context — though they raise new data-privacy considerations (PII in prompts,
    sensitive completions).

    - **Traces** are arguably *more* important for LLM apps than for traditional systems, because LLM
    pipelines are multi-step: query rewriting → retrieval → reranking → prompt assembly → model call →
    post-processing. Distributed tracing is what lets you pinpoint whether slowness came from your vector
    DB, your retriever, or the model itself.


    **Why the pillars are not enough on their own**

    Traditional observability assumes predictable, deterministic systems. LLMs break that assumption in
    several ways:

    1. **Non-deterministic outputs** — the same prompt can produce different completions, so a metric
    like "error rate" misses quality issues that only appear in the content itself.

    2. **Qualitative failure modes** — hallucinations, tone drift, prompt-injection exploits, and inconsistent
    UX are not visible in CPU usage or HTTP status codes. You need evaluation signals (e.g., hallucination
    scores, faithfulness to retrieved context, toxicity) layered on top of traditional telemetry.

    3. **New entities to instrument** — prompts, completions, embeddings, retrieved chunks, tool calls,
    and agent reasoning steps are first-class objects that classic APM was never designed to capture as
    structured fields.

    4. **Drift and regressions** — model behavior can quietly degrade as upstream providers update weights,
    as your retrieval corpus changes, or as user behavior shifts. Detecting this requires ongoing output-quality
    evaluation, not just uptime monitoring.


    **The modern LLM observability model**

    The industry (and Datadog''s LLM Observability product) has effectively added new "pillars" alongside
    the originals:

    - **Evaluations** (hallucination detection, relevance, safety, faithfulness) — often run by an LLM-as-a-judge

    - **Prompt and completion data** as first-class structured fields

    - **Retrieval quality metrics** (precision/recall of retrieved chunks, context relevance)

    - **Cost and token economics** as a first-class concern

    - **Feedback loops** from end users and production outcomes


    **Bottom line:** The three pillars are your baseline plumbing — you absolutely still need metrics,
    logs, and traces. But for LLM applications you must extend them with output-quality evaluations, prompt/completion
    tracking, and retrieval-aware telemetry. Discard the traditional pillars and you lose your debugging
    foundation; rely on them alone and you''ll miss the most important class of LLM failures: the ones
    that look perfectly healthy in your dashboards but are silently returning confident nonsense.'

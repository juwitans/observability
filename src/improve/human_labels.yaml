  question: That's way too vague, it barely answers anything. Can you explain in much more detail?
  answer: 'Observability is a discipline that goes well beyond traditional monitoring, and understanding
    why requires unpacking several distinct ideas from the context. Here is a detailed walkthrough.


    ---


    ## 1. Monitoring vs. Observability: The Core Distinction


    According to Charity Majors (as captured in the *Building Observability Tools* page), the two solve
    fundamentally different problems:


    - **Monitoring** is built to handle *known-unknowns*. Engineers know in advance what kinds of failures
    can happen, so they set up predefined thresholds, alerts, and runbooks. If CPU usage exceeds 90%,
    an alert fires. If a service returns 500 errors, a runbook kicks in. This works because the questions
    are predictable.

    - **Observability** is built to handle *unknown-unknowns*. These are questions engineers didn''t know
    they would need to ask. A new failure mode appears in production, and the team must reconstruct the
    system state without having shipped code to handle that specific state. If you had shipped code to
    handle it, by definition it was a known-unknown — and monitoring would have been sufficient.


    This distinction matters because it changes what kind of data you need to collect. Monitoring can
    rely on aggregated counters and pre-aggregated metrics. Observability demands enough raw detail that
    you can ask *new* questions of *old* data.


    ---


    ## 2. Majors'' Event-Based Specification


    Majors argues that any tool claiming to deliver observability must meet a specific set of requirements.
    Each one exists because it enables a specific kind of investigation:


    - **Arbitrarily-wide structured raw events**: A single event can carry as many key-value pairs as
    needed. This is what lets you ask questions you didn''t pre-define — you don''t have to decide in
    advance which fields matter.

    - **Context persisted through the execution path**: A request flows across many services. The context
    (trace ID, user ID, session ID, feature flags, etc.) must travel with it so that when you find a problem,
    you can reconstruct the full journey.

    - **No indexes or schemas**: Indexes and schemas force you to know your query patterns in advance.
    Observability demands that you can explore freely, so the storage layer should accept arbitrary structure.

    - **High-cardinality, high-dimensionality**: You must be able to filter on rare values (a specific
    user ID, a specific build version, a specific request ID). Traditional metrics systems collapse these
    dimensions at write time, which destroys the ability to investigate outliers.

    - **Ordered dimensions for traceability**: When you slice across dimensions, the order matters — you
    need to be able to follow a causal chain through the system, not just count events in buckets.

    - **Client-side dynamic sampling**: Because the volume of events is enormous, the decision about which
    events to keep in full detail must be made intelligently. Dynamic sampling lets the client decide
    based on what it''s currently seeing, rather than blindly recording everything or sampling uniformly.

    - **An exploratory visual interface**: Engineers need to slice, dice, and combine dimensions interactively.
    A static dashboard is not enough — the UI must support the kind of ad-hoc exploration that unknown-unknowns
    require.

    - **Close to real-time**: When something is broken, you can''t wait hours for batch processing. The
    data needs to be queryable almost as soon as it''s generated.


    Majors explicitly rejects the "three pillars" framing (metrics, logs, traces) as a model of observability,
    calling it "bullshit." Her argument is that metrics lose the connective tissue between data points
    (you can''t see what happened between the data points), and schemas constrain the questions that can
    be asked. Instead, she argues the single primitive should be the wide, structured event scoped to
    a request — and metrics, logs, and traces are all derived views onto that primitive rather than separate
    pillars.


    ---


    ## 3. Why LLM Observability is Different


    The *LLM Observability* page makes clear that traditional APM tools are not sufficient for LLM systems,
    for several reasons:


    - **Non-determinism**: The same input to an LLM can produce different outputs on different runs. Traditional
    monitoring assumes predictable systems; LLM systems are probabilistic. The shift is from tracking
    uptime to measuring output reliability and drift over time.

    - **Qualitative failure modes**: Hallucinations, prompt-injection attacks, and inconsistent user experiences
    are not the kind of failure that shows up in a CPU graph or an error rate. They are semantic problems,
    and detecting them requires evaluating the *content* of outputs, not just their metadata.

    - **Cost unpredictability**: LLM costs scale with token usage, which can spike unpredictably depending
    on prompt length, model selection, or retry behavior. Cost becomes a first-class observability concern,
    not a billing afterthought.

    - **Observability vs. Evaluation**: These are distinct but interconnected. Evaluation happens *before*
    deployment (does this model behave correctly on my test set?). Observability happens *after* deployment
    (how is it behaving in the real world, on real user data, right now?). Both are needed — evaluation
    without observability leaves you blind in production, and observability without evaluation means you
    have no baseline to compare against.


    The LLM Observability Playbook (referenced in the page) is described as a practical checklist of what
    to actually track, and the tool landscape section describes the emerging ecosystem of solutions, from
    comprehensive AI development platforms to specialized tracing libraries and general APM tools that
    are adding LLM features.


    ---


    ## 4. Hallucination Detection in Practice


    The *LLM Hallucination Detection* page goes deep on one specific failure mode. A hallucination is
    when an LLM confidently produces false or unsupported information. This is dangerous because it can
    spread misinformation, damage reputation, and erode user trust.


    A common misconception is that retrieval-augmented generation (RAG) eliminates hallucinations. It
    does not. RAG reduces them by grounding the LLM in retrieved sources, and by prompting the model to
    cite those sources — but LLMs can still fabricate responses *while citing sources*, giving users a
    false sense of confidence. The citations look legitimate, the language sounds authoritative, and the
    underlying claim is invented.


    Datadog''s hallucination detection is described as an out-of-the-box evaluation in Datadog LLM Observability.
    It works by comparing the LLM''s output against the context provided from retrieved sources, and it
    answers questions like:


    - Did the LLM interpret the retrieved sources correctly?

    - Did the LLM omit key facts from the sources in a way that changed the meaning of the response?

    - Did the LLM fabricate a plausible-sounding citation that the source does not actually support?


    In other words, hallucination detection is not a single check — it is a set of evaluations that together
    assess whether the output is faithfully grounded in the provided context. For teams running RAG applications
    in production, this is an ongoing concern, not a one-time fix.


    ---


    ## 5. How These Pieces Fit Together


    The three pages together describe a coherent picture:


    - **The building-observability-tools page** gives you the *theoretical specification* — what any observability
    tool must be capable of.

    - **The llm-observability page** applies that thinking to a *new domain* where conventional monitoring
    fails, and explains what a specialized approach looks like.

    - **The llm-hallucination-detection page** zooms into a *specific evaluation* that operationalizes
    one of the key concerns raised in the LLM observability discussion.


    The throughline is that in both classical distributed systems and LLM applications, the hardest problems
    are the ones you didn''t predict. Observability — in the Majors sense — is the discipline of building
    systems that can answer those questions anyway.'

  question: How do you detect hallucinations in an LLM app?
  answer: 'Detecting hallucinations in an LLM application requires an ongoing, dedicated evaluation capability
    rather than relying solely on techniques like retrieval-augmented generation (RAG). While RAG helps
    reduce hallucinations by supplying verified context and prompting the model to cite sources, LLMs
    can still fabricate plausible-sounding outputs even when citing those sources, so hallucination detection
    must be treated as a separate, continuous concern.


    According to Datadog''s LLM Observability documentation, hallucination detection is delivered as an
    out-of-the-box evaluation that flags when an LLM''s output disagrees with the context provided by
    retrieved sources. To detect hallucinations effectively, an LLM application team needs the ability
    to answer a set of targeted questions about every response the model produces:


    1. Did the LLM interpret the retrieved sources correctly?

    2. Did the LLM omit key facts from the sources (i.e., the context) in a way that changed the meaning
    of the response?

    3. Did the LLM''s output reflect what the source actually said, or did the LLM fabricate a plausible-sounding
    citation?


    Answering these questions at scale requires observability tooling that can capture the prompt, the
    retrieved context, and the model''s output together, then automatically evaluate whether the output
    is grounded in (or contradicts) the supplied context. Once that pipeline is in place, teams can proactively
    identify, analyze, and reduce hallucinations rather than discovering them only after users report
    bad answers.


    Practically, the detection workflow looks like this:

    - Instrument the LLM application so each request captures the input, retrieved context, and generated
    output as structured events.

    - Run an automated evaluator over those events that compares the output''s claims against the retrieved
    context.

    - Surface disagreements as flagged evaluations tied back to the original request, so engineers and
    product owners can triage them.

    - Track hallucination rates over time, set alerts on regressions, and use the findings to refine prompts,
    retrieval, or fine-tuning.


    In short, you detect hallucinations by continuously evaluating LLM outputs against grounded context
    using a dedicated evaluation feature (such as the out-of-the-box hallucination detection available
    in Datadog LLM Observability) and by having the observability pipeline in place to surface, analyze,
    and act on those findings across your production traffic.'

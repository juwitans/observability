  question: what do you mean by single primitive?
  answer: 'By "single primitive," Charity Majors of Honeycomb means that observability should be built
    around one fundamental data unit rather than the conventional "three pillars" (metrics, logs, and
    traces). Specifically, that single primitive is the **wide, structured event scoped to a request**.


    The argument goes like this: traditional observability tooling treats metrics, logs, and traces as
    three separate, distinct data types, each with its own schema, storage, and query model. Majors rejects
    this framing (calling it "bullshit") because it is structurally incapable of delivering true observability.
    Here''s why one primitive — the rich event — is preferred:


    1. **Connective tissue is preserved**: Statsd-style metrics aggregate data points at write time, losing
    the relationships between them. When something goes wrong, you can''t reconstruct what actually happened
    because the context between events is gone.


    2. **Schemas constrain future questions**: Strict schemas (common in traditional logs and traces)
    only let you ask questions you anticipated in advance. But observability is about handling *unknown-unknowns*
    — questions you didn''t know to ask until something broke. A wide structured event has no rigid schema,
    so you can query any dimension retroactively.


    3. **One event can answer all question types**: A single well-instrumented event contains enough data
    to derive metrics, reconstruct logs, or trace causality. You don''t need three separate systems; you
    need rich events that can be sliced and diced in different ways during analysis.


    4. **Scoping to a request** is key: The event isn''t a random log line — it''s tied to a specific
    request''s execution path, with context (correlation IDs, user info, business attributes) persisted
    through every span. This is what allows engineers to reconstruct unfamiliar system states without
    shipping new code.


    In short, the "single primitive" claim is the idea that you don''t need three pillars — you need one
    highly-detailed, arbitrarily-wide, structured event per request, plus an exploratory interface that
    can query it flexibly. Everything else (dashboards, metrics, alerts) is derived on top of that one
    foundation.'

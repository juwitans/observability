  question: Are there exactly three pillars of observability?
  answer: 'The answer depends on whom you ask, and the context reflects an active disagreement.


    **The conventional view: Yes, there are three pillars.** The mainstream framing, described in the
    three-pillars-of-observability page, holds that observability is built on metrics, logs, and traces.
    These are presented as three distinct, interrelated categories of telemetry data that together give
    operators visibility into complex, distributed systems. The framing is borrowed from other domains
    (like corporate responsibility''s environmental/social/financial pillars, or Scrum''s transparency/inspection/adaptation)
    where distinct components are individually essential but only deliver real value in combination.


    **The dissenting view: No, the pillars framing is wrong.** The building-observability-tools page captures
    Charity Majors of Honeycomb''s argument that the three pillars model is "bullshit." She argues that
    observability is fundamentally about a single primitive: the wide, structured event scoped to a request.
    In her view, building observability on top of statsd-style metrics or rigid schemas is structurally
    incapable of delivering on the observability promise, because metrics lose the connective tissue between
    data points and schemas constrain the questions that can be asked in advance. Observability, she says,
    should manage unknown-unknowns by instrumenting code at a level of detail that lets engineers answer
    new questions and reconstruct unfamiliar system states without shipping new code.


    **Practical takeaway:** If you accept the conventional taxonomy, there are exactly three pillars.
    If you accept Majors''s critique, the pillars are an inadequate mental model and events are the true
    foundation — which is consistent with the three-pillars page''s own observation that observability
    is "driven by system events" that produce the data underlying metrics, logs, and traces. So even the
    pillars framework implicitly treats events as the underlying primitive, just from a different angle.'

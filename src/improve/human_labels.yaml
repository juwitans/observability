  question: How does LLM observability differ from traditional observability?
  answer: 'LLM observability differs from traditional observability in several fundamental ways:


    1. **Non-determinism vs. determinism**: Traditional observability tools and APM systems assume predictable,
    deterministic system behavior. LLMs are non-deterministic — the same input can produce different outputs
    — which breaks the assumptions built into standard monitoring tools. This forces a shift from tracking
    uptime to measuring output reliability and drift.


    2. **New failure modes**: Traditional observability is built to catch crashes, errors, latency spikes,
    and resource exhaustion. LLM applications introduce qualitatively different failure modes — hallucinations,
    cost spikes, prompt-injection attacks, and inconsistent user experiences — that are often invisible
    to normal logs and metrics.


    3. **Output quality, not just system health**: Whereas traditional monitoring centers on whether the
    system is up and fast, LLM observability must also evaluate whether outputs are correct, faithful
    to retrieved context, safe, and useful. This is a semantic and qualitative judgment, not a threshold-based
    one.


    4. **Cost as a first-class signal**: LLM applications have unpredictable, token-based costs that can
    spike based on prompt length, model selection, or user behavior. Cost anomalies become a core observability
    concern alongside latency and error rates, whereas in traditional systems cost is usually a static
    infrastructure concern.


    5. **Security and safety dimensions**: Traditional observability rarely tracks prompt-level threats
    like prompt injection or data leakage. LLM observability must monitor for these as ongoing concerns.


    6. **Richer event structure for probabilistic systems**: As Charity Majors argues, true observability
    requires wide, structured, high-cardinality events that let engineers ask new questions without shipping
    new code. This is especially true for LLMs, where the questions teams need to ask (e.g., "which prompt
    templates produce hallucinations?", "which user segments see drift?") cannot be predicted in advance
    — making aggregated metrics and fixed-schema logs insufficient.


    In short, traditional observability assumes you can define what "good" looks like in advance through
    thresholds and dashboards. LLM observability has to instrument rich, exploratory events so teams can
    investigate probabilistic behavior, qualitative outputs, and emergent failure modes they didn''t anticipate.'

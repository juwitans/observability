- trace_id: 5bbfd11c1cd57cbc2e5271a1041a66e6
  question: Which of those differences matters most for catching hallucinations?
  answer: 'The single most consequential difference for catching hallucinations is whether your observability
    pipeline preserves the full request context end-to-end and evaluates it after the response is generated
    — in other words, a combination of **tail-based sampling** and **context-persisted wide events**.


    Here''s why this stands out above the other differences:


    **1. You cannot decide at the start of a request whether a hallucination occurred.** A hallucination
    is, by definition, a property of the *output* relative to the *retrieved context*. The sampling decision
    therefore has to be made *after* the LLM finishes generating — which rules out head-based sampling
    for any reliable hallucination signal. Tail-based sampling lets you keep the trace in a buffer, inspect
    the LLM''s final answer against the retrieved sources, and then decide whether to retain it (or attach
    a hallucination score) before discarding the rest.


    **2. You need the entire chain of evidence in one place.** Hallucination detection specifically asks:
    *Did the LLM interpret the retrieved sources correctly? Did it omit key facts? Did it fabricate a
    citation?* To answer those questions you need, in a single correlated record, the user prompt, the
    retrieved chunks, the LLM''s output, and ideally any tool calls or agent steps. The "context persisted
    through the execution path" requirement is what makes this possible — metrics aggregates or pre-aggregated
    logs lose the connective tissue between the source documents and the final answer.


    **3. High-cardinality dimensions let you localize the problem.** Once you can score individual responses,
    you need to slice by model version, prompt template, retrieval index version, chunk size, document
    source, user segment, and so on. High-cardinality, schema-less events are what make it possible to
    ask *which* prompts, *which* retrieved sources, or *which* model updates correlate with hallucination
    spikes — without shipping new code to instrument those new dimensions.


    **4. Close-to-real-time feedback closes the loop.** Hallucinations damage user trust quickly, so the
    ability to alert, re-rank, or block bad responses in near real-time is more valuable here than in
    many traditional observability use cases.


    **5. Ordered dimensions and exploratory UI matter for forensics.** When a hallucination is reported,
    the first question is *show me the exact request*. The second is *what did the LLM see versus what
    did it say?* Both questions depend on being able to reconstruct an unfamiliar state from a single
    wide event — exactly the unknown-unknowns workflow that distinguishes observability from monitoring.


    The "no indexes or schemas" point is also quietly important: hallucination evaluation methods are
    evolving fast (LLM-as-judge, entailment classifiers, citation faithfulness checks), and a rigid schema
    would force a migration every time the evaluation model changes. Wide, schemaless events absorb that
    churn.


    **Bottom line:** If forced to pick one difference, it is the shift from head-sampled, pre-aggregated
    metrics to **tail-sampled, context-rich events** — because hallucinations are a post-hoc, context-dependent
    judgment, and the observability system has to preserve enough fidelity to make that judgment at all.'

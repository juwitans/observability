  question: can you tell me what are the three pillars of observability
  answer: 'The three pillars of observability are **metrics**, **logs**, and **traces** — three categories
    of telemetry data that, when combined, give operators visibility into complex, distributed computing
    environments. Observability enables developers to understand a system''s internal state based on its
    external outputs, and IT personnel can identify the root cause of any performance issue by looking
    at the data the system produces, without any additional testing or coding.


    The "pillars" framing is borrowed from other domains that organize their foundations into three interrelated
    components (like corporate responsibility''s environmental/social/financial sustainability, or Scrum''s
    transparency/inspection/adaptation). In each case, the pillars are distinct and essential but incomplete
    on their own — their real power lies in how they collaborate.


    Observability is driven by system **events** — distinct occurrences on a network that happen at specific
    times and that typically produce the data that becomes logs, metrics, and traces. For example, when
    a client requests resources from an enterprise server, the request is directed to an API endpoint
    using its URL, the server checks the request for API key authentication credentials and client permissions,
    and — assuming they are valid — processes the request according to the API''s specifications before
    sending a response back. Each of those moments is an event, and observability platforms rely on events
    to initiate the tracking, analysis, and correlation processes that help DevOps teams visualize and
    optimize their systems.


    It''s worth noting that this framing is contested in some parts of the observability community — for
    instance, Charity Majors of Honeycomb has argued that observability should be built on a single primitive
    (wide, structured events) rather than the three pillars, calling that framing structurally incapable
    of delivering on the observability promise.'

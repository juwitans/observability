    **1. Non-deterministic vs. Deterministic Systems**

    Traditional APM tools assume predictable, deterministic systems where the same input reliably produces
    the same output. LLMs, by contrast, are non-deterministic — the same prompt can produce different
    outputs on different runs. This means traditional monitoring approaches, which rely on predictable
    system behavior, are insufficient. Instead of tracking uptime, teams must measure output reliability
    and drift over time.


    **2. Unique Failure Modes**

    LLM applications exhibit failure modes that are largely invisible to traditional logs and metrics:

    - **Hallucinations**: LLMs can confidently generate false or unsupported information, which standard
    observability tools are not designed to catch.

    - **Cost spikes**: LLM API usage can lead to unpredictable cost anomalies based on token consumption.

    - **Security vulnerabilities**: Prompt-injection attacks and other adversarial inputs are unique to
    LLM systems.

    - **Inconsistent user experiences**: Output quality can vary in ways that traditional metrics cannot
    capture.


    **3. Qualitative vs. Quantitative Concerns**

    Traditional observability (as described by Charity Majors) is built around wide, structured events,
    high-cardinality dimensions, and exploratory querying to answer unknown-unknowns. LLM observability
    extends this with a strong focus on qualitative evaluation — for example, whether an LLM correctly
    interpreted retrieved sources, omitted key facts, or fabricated plausible-sounding citations. These
    are concerns that require dedicated evaluation mechanisms beyond standard metrics and traces.


    **4. New Alerting Requirements**

    Traditional monitoring relies on predefined thresholds for known metrics (latency, error rates, CPU
    usage). LLM observability requires alerts for qualitatively different signals, such as hallucination
    rates, output drift, and cost anomalies — things that are not captured by conventional thresholds.


    **5. Workflow Complexity**

    LLM applications often involve complex AI workflows such as retrieval-augmented generation (RAG),
    multi-step chains, and agentic behaviors. Even augmented techniques like RAG do not eliminate hallucinations,
    meaning teams need ongoing, separate observability for these workflows rather than relying on retrieval
    alone as a safeguard.


    In short, LLM observability extends the event-based, exploratory ethos of modern observability with
    new primitives designed to handle probabilistic outputs, qualitative failure modes, and the unique
    cost and security surface area of LLM-based systems.'

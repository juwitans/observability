- trace_id: cf7be33840fc3b2f6ee152e500541645
  question: What are the best practices for prompt monitoring in production LLM applications?
  answer: 'Based on the provided context, here are the best practices for prompt monitoring in production
    LLM applications:


    ## 1. Shift from Uptime to Output Quality

    Traditional APM assumes predictable systems, but LLMs are non-deterministic — the same prompt can
    yield different outputs. Best practice is to track **output reliability and drift** rather than just
    uptime.


    ## 2. Track Hallucination Rates as a First-Class Metric

    Hallucinations are a top failure mode. Best practices include:

    - Detecting when an LLM''s output **disagrees with retrieved context** (e.g., in RAG pipelines)

    - Answering specific questions for each response: Did the LLM interpret sources correctly? Did it
    omit key facts that changed meaning? Did it fabricate plausible-sounding citations?

    - Setting **alerts for hallucination rates**, since RAG alone does not prevent hallucinations — LLMs
    can still fabricate responses while citing sources


    ## 3. Monitor Cost, Latency, and Cost Anomalies

    LLM workloads can produce unpredictable cost spikes. Set alerts for latency changes and cost anomalies
    in addition to quality issues.


    ## 4. Watch for Security Threats (Prompt Injection)

    Monitor for prompt-injection attacks and other adversarial inputs as part of your production observability
    strategy.


    ## 5. Pair Pre-Deployment Evaluation with Post-Deployment Observability

    These are distinct but interconnected: use evaluations before launch to set a baseline, and observability
    afterward to catch drift, regressions, and rare failures in production traffic.


    ## 6. Instrument with Observability-Grade Tooling

    Following the event-based observability specification, your monitoring infrastructure should support:

    - **Arbitrarily-wide structured raw events** so you can capture the full prompt, response, retrieved
    context, metadata, and any dimension you may later need to query

    - **Context persisted through the execution path** to trace a single prompt from input through retrieval,
    model call, and post-processing

    - **High-cardinality, high-dimensionality** data (e.g., per-user, per-prompt-template, per-model-version
    attributes)

    - **Ordered dimensions for traceability** to reconstruct unfamiliar prompt failure modes

    - **Client-side dynamic sampling** so you can sample intelligently when volume is high

    - **An exploratory visual interface** that lets you slice and dice by prompt template, user segment,
    model version, etc.

    - **Close to real-time** visibility so you can react quickly to regressions or attacks


    ## 7. Capture Unknown-Unknowns

    Because LLM failure modes are often qualitative and invisible to normal logs, choose tooling that
    lets you answer *new* questions about prompt behavior without shipping new code — i.e., avoid metrics-only
    or rigid-schema systems that constrain the questions you can ask in advance.


    ## 8. Treat Inconsistent User Experience as a Signal to Monitor

    User-facing inconsistencies are a top failure mode; instrument prompts so you can correlate complaints
    and behavior with specific prompt versions and response characteristics.'

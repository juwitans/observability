- trace_id: 9ddec8623a3fd3851ac398bfd82ea7e4
  question: so, why traditional monitoring doesn't work in LLM case?
  answer: 'Traditional monitoring falls short for LLM-based systems for several interconnected reasons:


    1. **Non-deterministic behavior**: LLMs are probabilistic by nature, meaning the same input can produce
    different outputs. Traditional APM (Application Performance Monitoring) tools are designed around
    predictable systems with expected behavior, and they assume you can track things like uptime, error
    rates, and latency against stable baselines. With LLMs, there is no fixed "correct" output to compare
    against, so the traditional uptime/downtime model is meaningless.


    2. **Unique failure modes are qualitative, not quantitative**: Traditional monitoring excels at catching
    hard failures (crashes, exceptions, timeouts), but LLM failures are subtle and qualitative. The top
    failure modes — hallucinations, cost spikes, prompt-injection attacks, and inconsistent user experiences
    — are often invisible to normal logs and metrics. You can''t simply check a status code to know if
    a response was factually wrong or misleading.


    3. **Shift from uptime to output reliability and drift**: Because LLMs can degrade silently (their
    behavior can drift as models update, as context sources change, or as user inputs evolve), the focus
    has to shift from "is the system up?" to "is the output still reliable?" This requires measuring things
    like hallucination rates, output quality, and behavioral drift over time — dimensions that traditional
    monitoring tools were not built to capture.


    4. **Unpredictable performance and cost**: LLM calls can have highly variable latency and token costs
    depending on the prompt and response length. Traditional thresholds and alerting on static metrics
    don''t capture this variability well, requiring new approaches to detect cost anomalies and latency
    changes.


    5. **Security and privacy concerns**: Issues like prompt hacking and data leakage are semantic problems,
    not infrastructure problems, so they slip past conventional security monitoring.


    In short, traditional monitoring was built for known-unknowns (predefined thresholds and runbooks),
    but LLMs introduce unknown-unknowns — qualitative, probabilistic issues that demand a richer, event-based
    observability approach that can capture the full context of each request and answer new questions
    without shipping new code.


    Cited slugs: llm-observability, building-observability-tools'

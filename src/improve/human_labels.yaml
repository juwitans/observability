- trace_id: 03a16c585d6735ee6e9b438ebacf2194
  question: How does LLM observability differ from traditional observability?
  answer: 'LLM observability differs from traditional observability in several fundamental ways because
    the systems being observed are fundamentally different in nature.


    **1. Non-determinism vs. determinism.** Traditional observability, as Charity Majors argues, is built
    to handle unknown-unknowns in systems that are otherwise predictable — a given input yields a given
    output, and anomalies come from infrastructure, not logic. LLMs invert this: the same prompt can produce
    different responses on every call. You cannot reason about an LLM the way you reason about a web service.
    As a result, the central question shifts from "is the system up?" to "is the output reliable?" — tracking
    uptime becomes secondary to measuring output quality and drift.


    **2. Qualitative vs. quantitative failures.** Traditional monitoring excels at catching things like
    latency spikes, error rate thresholds, and saturation — known-unknowns expressible as metrics. LLM
    failure modes are qualitative: hallucinations, subtle bias, fabricated citations, tone drift, and
    prompt-injection compromises. These are largely invisible to logs and metrics because the response
    may look syntactically perfect while being semantically wrong or unsafe. You need new primitives —
    such as out-of-the-box evaluators that compare an LLM''s output against retrieved context to flag
    disagreement — because conventional structured logs have no field for "the answer sounds right but
    isn''t."


    **3. Observability vs. evaluation as a first-class concern.** In traditional systems, pre-deployment
    testing (unit/integration tests) and post-deployment monitoring are separate disciplines. With LLMs,
    evaluation must be continuous and integrated into both phases. You need to score outputs against ground
    truth or retrieved context in production, not just in staging, because model behavior, prompt effectiveness,
    and retrieval quality all drift over time. The two practices (observability and evaluation) become
    tightly coupled.


    **4. New cost and security dimensions.** Traditional observability tracks compute, memory, and request
    costs. LLM observability must also track token consumption, which is highly variable per request and
    can spike with prompt chaining or agentic loops. Security observability expands to include prompt-injection
    attempts, jailbreaks, and sensitive-data leakage — attack surfaces that don''t exist in conventional
    services.


    **5. Complex, multi-step AI workflows.** A typical LLM application is not a single request/response.
    It''s a pipeline: retrieval, reranking, prompting, tool calls, sometimes multi-agent orchestration,
    and finally generation. Traditional request-scoped tracing handles this awkwardly because the "request"
    is now a graph of LLM calls, each with its own model, prompt, and context. Tracing needs to capture
    prompt templates, retrieved documents, tool invocations, and intermediate reasoning — dimensions traditional
    APM schemas weren''t designed for.


    **6. Human and contextual feedback loops.** Traditional observability largely relies on system-generated
    signals. LLM observability places much more weight on human feedback (thumbs up/down, corrections,
    expert review) and on context-dependent signals (was the retrieved source actually relevant? did the
    model respect system instructions?). This means the "wide event" model that Majors champions — high-cardinality,
    schema-less, exploratory — is arguably even more important for LLMs, because the questions you''ll
    need to ask of your traces tomorrow are not the ones you''re asking today.


    In short, LLM observability borrows the philosophy of modern observability (rich events, high cardinality,
    exploratory analysis) but extends it into territory where the unit of failure is meaning itself, not
    availability.'

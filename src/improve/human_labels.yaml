  question: Are there exactly three pillars of observability?
  answer: 'Not according to everyone. The traditional framing defines exactly three pillars of observability:
    metrics, logs, and traces. As described in the wiki''s page on the topic, these are three categories
    of telemetry data that together give operators visibility into complex, distributed systems, with
    system events serving as the foundation that produces these data types.


    However, the three-pillar framing is contested. Charity Majors of Honeycomb explicitly rejects it
    as a model of the discipline, calling the framing ''bullshit.'' Her argument, captured in the wiki''s
    page on building observability tools, is that observability is fundamentally about a single primitive:
    the wide, structured event scoped to a request. In her view, building observability on top of statsd-style
    metrics or strict schemas is structurally incapable of delivering on the observability promise, because
    metrics lose the connective tissue between data points and schemas constrain the questions that can
    be asked in advance. Instead, she argues a true observability tool must support characteristics like
    arbitrarily-wide structured raw events, context persisted through the execution path, no indexes or
    schemas, high-cardinality/high-dimensionality, ordered dimensions for traceability, client-side dynamic
    sampling, an exploratory visual interface, and close to real-time performance.


    So while the conventional answer is yes, three pillars (metrics, logs, traces), at least one prominent
    voice in the field argues that framing is wrong and that observability should be understood around
    a different primitive entirely.'

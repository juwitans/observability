- trace_id: ad53c8d3f6bea24477d8d6aede269c01
  question: How do you detect hallucinations in an LLM app?
  answer: '## How to Detect Hallucinations in an LLM App


    A hallucination occurs when a large language model (LLM) confidently generates information that is
    false or unsupported. Detecting these is important because they can spread misinformation, cause reputational
    damage, and erode user trust.


    ### Why RAG Alone Isn''t Enough


    Retrieval-augmented generation (RAG) reduces hallucinations by providing LLMs with relevant context
    from verified sources and prompting them to cite those sources. However, RAG does not *prevent* hallucinations
    — LLMs can still fabricate responses while citing sources, giving users a false sense of confidence.
    So hallucination detection must be handled as a separate, ongoing concern.


    ### How Hallucination Detection Works


    To detect hallucinations, you need the ability to answer a set of questions about each LLM response,
    such as:


    1. **Did the LLM interpret the retrieved sources correctly?**

    2. **Did the LLM omit key facts from the sources (i.e., the context) in a way that changed the meaning
    of the response?**

    3. **Did the LLM''s output reflect what the source actually said, or did the LLM fabricate a plausible-sounding
    citation?**


    By systematically checking the model''s output against the retrieved source material, you can flag
    responses where the output disagrees with the verified context.


    ### Datadog''s Approach


    Datadog provides hallucination detection as an **out-of-the-box evaluation** within Datadog LLM Observability.
    It automatically detects when an LLM''s output disagrees with the context provided from retrieved
    sources, enabling teams to proactively identify, analyze, and reduce hallucinations and produce more
    reliable RAG-powered responses.


    ### General Best Practices


    Because hallucinations are a qualitative problem that is often invisible in normal logs, broader LLM
    observability guidance suggests you should:

    - Treat output reliability and drift as first-class signals (rather than just uptime), since LLMs
    are non-deterministic.

    - Set alerts for **hallucination rates**, **latency changes**, and **cost anomalies** as part of your
    monitoring strategy.

    - Combine pre-deployment **evaluation** with post-deployment **observability** to catch issues across
    the lifecycle.


    In short: instrument your LLM app to compare its outputs against the retrieved/contextual ground truth,
    score each response for faithfulness to the sources, track those scores over time, and alert on regressions.'

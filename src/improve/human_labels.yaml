    ## Classic Chocolate Chip Cookies


    **Ingredients (makes ~24 cookies)**

    - 1 cup (226 g) unsalted butter, softened

    - 3/4 cup (150 g) granulated sugar

    - 3/4 cup (165 g) packed brown sugar

    - 2 large eggs

    - 1 tsp vanilla extract

    - 2 1/4 cups (280 g) all-purpose flour

    - 1 tsp baking soda

    - 1 tsp salt

    - 2 cups (340 g) semisweet chocolate chips


    **Instructions**

    1. Preheat oven to 375°F (190°C). Line baking sheets with parchment paper.

    2. In a large bowl, cream together the butter, granulated sugar, and brown sugar until light and fluffy
    (~2–3 minutes).

    3. Beat in the eggs one at a time, then stir in the vanilla.

    4. In a separate bowl, whisk together the flour, baking soda, and salt.

    5. Gradually mix the dry ingredients into the wet ingredients until just combined.

    6. Fold in the chocolate chips.

    7. Drop rounded tablespoons of dough onto the prepared baking sheets, spacing them about 2 inches
    apart.

    8. Bake for 9–11 minutes, until the edges are golden but the centers still look slightly soft.

    9. Let cool on the baking sheet for 5 minutes, then transfer to a wire rack to finish cooling.


    **Tips**

    - For chewier cookies, slightly underbake and let them set on the pan.

    - For crispier cookies, flatten the dough balls slightly and bake a minute longer.

    - Chilling the dough for 30+ minutes deepens the flavor.


